<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f4ee"><title>Account access — Karigar</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 15%,#ead8ab 0,transparent 28%),linear-gradient(145deg,#f8f5ea,#ede9f3);color:#29293b;font:15px Arial,sans-serif;display:grid;place-items:center;padding:22px}.card{width:min(460px,100%);background:#fffefa;border:1px solid #e8e2d7;border-radius:22px;padding:30px;box-shadow:0 24px 70px #29293b20}.brand{font:700 27px Georgia,serif;margin-bottom:5px}.tag{color:#79776f;font-size:13px;margin-bottom:26px}.eyebrow{font-size:11px;letter-spacing:1.4px;font-weight:bold;color:#a56431;text-transform:uppercase}.title{font:600 32px Georgia,serif;margin:8px 0}.sub{color:#76766f;line-height:1.55;margin:0 0 22px}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:13px;font-weight:600}.field input,.field select{width:100%;border:1px solid #ddd9d0;border-radius:10px;padding:12px 13px;background:white;font:inherit}.btn{width:100%;border:0;border-radius:10px;padding:13px;background:#484f78;color:white;font-weight:700;font-size:15px;cursor:pointer;margin-top:7px}.link{display:block;text-align:center;color:#484f78;margin-top:18px;text-decoration:none}.error{min-height:20px;color:#a33030;font-size:13px;margin-top:8px}.back{display:inline-block;margin-bottom:20px;color:#484f78;text-decoration:none}.optional{color:#777;font-weight:normal}.hidden{display:none!important}
</style></head>
<body><main class="card"><a class="back" href="/">← Back to Karigar</a><div class="brand">K karigar</div><div class="tag">MADE WITH MEANING</div><div class="eyebrow">YOUR HANDMADE MARKETPLACE</div><h1 class="title" id="title">Welcome back</h1><p class="sub" id="subtitle">Sign in to continue to your Karigar account.</p>
<form id="form"><div class="field hidden" id="name-field"><label for="name">Your name</label><input id="name" autocomplete="name"></div><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" minlength="8" autocomplete="current-password" required></div><div class="field hidden" id="role-field"><label for="role">I’m joining as</label><select id="role"><option value="artisan">Artisan — I sell handmade products</option><option value="buyer">Buyer — I shop handmade</option></select></div><div class="field hidden" id="location-field"><label for="location">Your town or district <span class="optional">(optional)</span></label><input id="location" placeholder="e.g. Kutch, Gujarat"></div><div class="error" id="error" role="alert"></div><button class="btn" id="submit" type="submit">Sign in</button></form><a class="link" id="switch" href="/auth.html?mode=signup">New to Karigar? Create an account</a></main>
<script>
const params=new URLSearchParams(location.search);let mode=params.get('mode')==='signup'?'signup':'login';const el=id=>document.getElementById(id);if(params.get('role')==='artisan')el('role').value='artisan';function paint(){const signup=mode==='signup';el('title').textContent=signup?'Join the marketplace':'Welcome back';el('subtitle').textContent=signup?'Create an account to sell or shop handmade.':'Sign in to your Karigar account.';el('submit').textContent=signup?'Create account':'Sign in';el('switch').textContent=signup?'Already have an account? Sign in':'New to Karigar? Create an account';el('switch').href='/auth.html?mode='+(signup?'login':'signup');el('name-field').classList.toggle('hidden',!signup);el('role-field').classList.toggle('hidden',!signup);el('location-field').classList.toggle('hidden',!signup);el('name').required=signup;el('password').autocomplete=signup?'new-password':'current-password'}paint();el('form').addEventListener('submit',async event=>{event.preventDefault();el('error').textContent='';const data={email:el('email').value.trim(),password:el('password').value};if(mode==='signup')Object.assign(data,{name:el('name').value.trim(),role:el('role').value,location:el('location').value.trim()});el('submit').disabled=true;el('submit').textContent='Please wait…';try{const response=await fetch('/api/'+mode,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(data)});const result=await response.json();if(!response.ok)throw new Error(result.error||'Could not continue. Please try again.');location.replace('/')}catch(error){el('error').textContent=error.message;el('submit').disabled=false;el('submit').textContent=mode==='signup'?'Create account':'Sign in'}});
</script></body></html>
